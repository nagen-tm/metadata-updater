[project]
name = "metadata-updater"
version = "0.1.0"
description = "Metadata Updater for MP3 files."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argparse>=1.4.0",
    "click>=8.5.0",
    "mutagen>=1.48.1",
    "pydantic>=2.13.5",
    "structlog>=26.1.0",
    "tqdm>=4.70.1",
]

[project.scripts]
metadata-updater = "metadata_updater:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "py2app>=0.28.10",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
